<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030733">
  <title>jeopardyVIBES</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .landing {
      min-height: 100vh; min-height: 100dvh;
      max-width: 1120px; margin: 0 auto;
      padding: 24px 20px 40px;
      display: flex; flex-direction: column;
    }
    .landing-top { display: flex; justify-content: space-between; align-items: center; }
    .landing-body {
      flex: 1;
      width: 100%; max-width: 440px; margin: 0 auto;
      display: flex; flex-direction: column; justify-content: center;
      gap: 28px;
      padding: 48px 0;
    }
    .pitch .h1 { font-size: clamp(2.4rem, 5vw, 4rem); margin: 0 0 16px; }
    .pitch .lede { max-width: 34ch; }
    .join-card { padding: 0; background: none; border: none; border-radius: 0; display: flex; flex-direction: column; gap: 16px; }
    .join-card input { background: var(--ink-2); }
    .join-card .h2 { font-size: 1.6rem; }
    .host-link { display: inline-block; margin-top: 18px; color: var(--paper-2); text-decoration: none; font-size: 0.95rem; }
    .host-link b { color: var(--paper); font-weight: 600; text-decoration: underline; text-decoration-color: var(--hi); text-decoration-thickness: 2px; text-underline-offset: 4px; }
    .host-link:hover b { color: var(--hi); }

    .landing-foot { color: var(--faint); font-size: 0.8rem; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

    @media (max-width: 860px) {
      .landing { padding: 18px 16px 28px; }
      .landing-body { justify-content: flex-start; gap: 24px; padding: 32px 0; }
      .pitch .h1 { margin: 0 0 10px; }
    }
  </style>
</head>
<body>
  <main class="landing">
    <header class="landing-top">
      <a class="wm" href="/">jeopardy<b>VIBES</b></a>
    </header>

    <section class="landing-body">
      <div class="pitch">
        <h1 class="h1">Join a game</h1>
        <p class="lede">Enter the room code shown on the TV and your name.</p>
      </div>

      <div>
        <form class="card join-card" onsubmit="event.preventDefault(); joinGame();">
          <div>
            <label for="roomCode">Room code</label>
            <input type="text" id="roomCode" placeholder="ABCD" maxlength="4" class="code-input" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
          </div>
          <div>
            <label for="playerName">Your name</label>
            <input type="text" id="playerName" placeholder="Your name" maxlength="20" autocomplete="off">
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block">Join game</button>
          <div id="join-error" class="field-error" role="alert"></div>
        </form>

        <a href="/host.html" class="host-link">Hosting? <b>Set up a game</b></a>
      </div>
    </section>

    <footer class="landing-foot">
      <span>Everyone needs to be on the same Wi-Fi.</span>
    </footer>
  </main>

  <script>
    const codeEl = document.getElementById('roomCode');
    const nameEl = document.getElementById('playerName');
    const params = new URLSearchParams(location.search);
    if (params.get('code')) { codeEl.value = params.get('code').toUpperCase().slice(0, 4); }

    codeEl.addEventListener('input', function () {
      this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (this.value.length === 4) nameEl.focus();
    });

    try { const last = localStorage.getItem('jv-name'); if (last) nameEl.value = last; } catch (e) {}

    function joinGame() {
      const name = nameEl.value.trim();
      const code = codeEl.value.trim().toUpperCase();
      const errEl = document.getElementById('join-error');
      if (code.length < 4) { errEl.textContent = 'The room code is 4 characters — check the TV.'; codeEl.focus(); return; }
      if (!name) { errEl.textContent = 'Add a name so the board knows who buzzed.'; nameEl.focus(); return; }
      errEl.textContent = '';
      try { localStorage.setItem('jv-name', name); } catch (e) {}
      window.location.href = `/player.html?code=${code}&name=${encodeURIComponent(name)}`;
    }
  </script>
</body>
</html>
